[project]
name = "datasette-otel-viewer"
version = "0.1.0a0"
description = "Browse the OpenTelemetry traces and metrics a Datasette instance emits, from inside that instance"
readme = "README.md"
authors = [{name = "Alex Garcia"}]
license = "Apache-2.0"
classifiers=[
    "Framework :: Datasette"
]
requires-python = ">=3.10"
dependencies = [
    "datasette>=1.0a41",
    "datasette-plugin-router>=0.0.1a4",
    "datasette-vite>=0.0.1a4",
    "opentelemetry-sdk>=1.37",
    "pydantic>=2.7",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/datasette/datasette-otel-viewer"
Changelog = "https://github.com/datasette/datasette-otel-viewer/releases"
Issues = "https://github.com/datasette/datasette-otel-viewer/issues"

[project.entry-points.datasette]
otel_viewer = "datasette_otel_viewer"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff>=0.15.0", "ty>=0.0.84"]
# `just dev` only, hence a non-default group: datasette-debug-gotham (and the
# debug bar it pulls in) inject themselves into every page Datasette renders,
# which the test suite and the doc screenshots have no business seeing. A
# plain `uv run` leaves an already-installed group in place, so the recipes
# that need a clean environment pass --exact. See the `dev` recipe in the
# Justfile.
devserver = ["datasette-debug-gotham"]

[tool.setuptools.packages.find]
include = ["datasette_otel_viewer*"]
exclude = ["frontend*"]

[tool.setuptools.package-data]
datasette_otel_viewer = ["static/**/*", "templates/**/*", "manifest.json"]

[tool.ruff.lint]
extend-select = ["W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # the formatter owns line length; long SQL/URL strings stay whole
    "B905",    # zip(strict=) would change metrics_math.py behaviour vs its TS twin
    "RUF005",  # `params + [x]` is how queries.py builds bind lists
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
