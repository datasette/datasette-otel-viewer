[project]
name = "datasette-otel-viewer"
version = "0.1.0a0"
description = "Browse the OpenTelemetry traces and metrics a Datasette instance emits, from inside that instance"
readme = "README.md"
authors = [{name = "Alex Garcia"}]
license = "Apache-2.0"
classifiers=[
    "Framework :: Datasette"
]
requires-python = ">=3.10"
dependencies = [
    "datasette>=1a37",
    "datasette-plugin-router>=0.0.1a4",
    "datasette-vite>=0.0.1a4",
    "opentelemetry-sdk>=1.37",
    "pydantic>=2",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/datasette/datasette-otel-viewer"
Changelog = "https://github.com/datasette/datasette-otel-viewer/releases"
Issues = "https://github.com/datasette/datasette-otel-viewer/issues"

[project.entry-points.datasette]
otel_viewer = "datasette_otel_viewer"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff>=0.15.0"]

[tool.setuptools.packages.find]
include = ["datasette_otel_viewer*"]
exclude = ["frontend*"]

[tool.setuptools.package-data]
datasette_otel_viewer = ["static/**/*", "templates/**/*", "manifest.json"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
datasette = { git = "https://github.com/simonw/datasette", rev = "asg017/otel-phase1-6-plugin-kit" }
